[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-analysis"
version = "0.1.0"
description = "Research pipeline for pose-based sprint analysis"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dynamic = ["dependencies"]

[project.scripts]
sport-analysis = "sport_analysis.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
